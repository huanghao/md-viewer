name = "md-viewer"
restart = "on-failure"

[processes.server]
command = "MDV_WORKSPACE_DAEMON_SOCKET=.cache/mdv-workspace-index.sock bun --watch run src/server.ts"
port = 3000
otel_service_name = "md-viewer-server"

[processes.workspace_index]
command = ".cache/mdv-workspace-scanner --daemon --socket .cache/mdv-workspace-index.sock"

[processes.client]
command = "bun run build:client:watch"
